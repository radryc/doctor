name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: doctor
      - uses: actions/checkout@v7
        with:
          repository: radryc/monofs
          path: monofs
      - uses: actions/checkout@v7
        with:
          repository: radryc/kvs
          path: kvs
      - uses: actions/checkout@v7
        with:
          repository: radryc/cfg
          path: cfg
      - uses: actions/setup-go@v7
        with:
          go-version-file: doctor/go.mod
          cache-dependency-path: doctor/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: doctor/frontend/package-lock.json
      - name: Build frontend
        working-directory: doctor/frontend
        run: npm ci && npm run build
      - name: Run tests
        working-directory: doctor
        run: go test ./...
