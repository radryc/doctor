apiVersion: guardian/v1alpha1
kind: Intent
metadata:
  name: rules-plane
spec:
  intentType: standard
  joins:
    - query-plane
  targetPusher: docker-main
  target:
    cluster: docker-main
  locked: false
  assets:
    - type: Compute
      name: doctor-rules
      properties:
        image: doctor-rules:latest
        env:
          DOCTOR_RULES_ENABLED: "true"
          DOCTOR_RULES_HTTP_ADDR: :18081
          DOCTOR_RULES_QUERY_URL: http://doctor-query:18080
          DOCTOR_RULES_RULER_ID: doctor-rules
          DOCTOR_RULES_LEASE_TTL: 30s
          DOCTOR_RULES_LEASE_RENEW: 10s
          DOCTOR_MONOFS_LOGENGINE_ADDR: host.docker.internal:9090
          # Dev-only token; override in production with a Guardian-issued token
          # that may write /doctor/**.
          DOCTOR_MONOFS_TOKEN: dev-guardian-token
          DOCTOR_MONOFS_CLIENT_ID: doctor-rules
        ports:
          - name: http
            containerPort: 18081
            protocol: TCP
