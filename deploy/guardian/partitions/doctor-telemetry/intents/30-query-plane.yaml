apiVersion: guardian/v1alpha1
kind: Intent
metadata:
  name: query-plane
spec:
  intentType: standard
  joins:
    - ingest-gateway
  targetPusher: docker-main
  target:
    cluster: docker-main
  locked: false
  assets:
    - type: Compute
      name: doctor-query
      properties:
        image: doctor-query:latest
        env:
          DOCTOR_QUERY_HTTP_ADDR: :18080
          DOCTOR_DEFAULT_TENANT: default
          DOCTOR_MONOFS_LOGENGINE_ADDR: host.docker.internal:9090
          DOCTOR_QUERY_GUARDIAN_HEALTH_ENABLED: "true"
          # Federation proxy (observe-first access control).
          DOCTOR_PROXY_ENABLED: "true"
          DOCTOR_PROXY_BACKENDS_FILE: /etc/doctor/backends.yaml
          DOCTOR_GUARDIAN_DISCOVERY_ENABLED: "false"
          DOCTOR_ACCESS_RESOLVER: owners
          DOCTOR_ACCESS_MODE: observe
          DOCTOR_AUTH_REQUIRE: "false"
        ports:
          - name: http
            containerPort: 18080
            protocol: TCP

    - type: LoadBalancer
      name: doctor-query-edge
      dependsOn:
        - doctor-query
      properties:
        targets:
          - doctor-query
        listeners:
          - name: http
            port: 18080
            protocol: TCP
