apiVersion: v1
kind: Namespace
metadata:
  name: sentinel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-sentinel
  namespace: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doctor-sentinel
  template:
    metadata:
      labels:
        app: doctor-sentinel
    spec:
      containers:
        - name: doctor-sentinel
          image: doctor-sentinel:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCTOR_SENTINEL_HTTP_ADDR
              value: ":18082"
            - name: DOCTOR_SENTINEL_AUTH_ALLOW_ALL
              value: "true"
            - name: DOCTOR_SENTINEL_DELIVERY_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 18082
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-sentinel
  namespace: sentinel
spec:
  selector:
    app: doctor-sentinel
  ports:
    - name: http
      port: 18082
      targetPort: http
