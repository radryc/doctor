apiVersion: guardian/v1alpha1
kind: Intent
metadata:
  name: platform
spec:
  intentType: standard
  targetPusher: k8s-main
  target:
    cluster: k8s-main
    namespace: strata
  locked: false
  assets:
    - type: Compute
      name: doctor-ingest
      properties:
        image: strata/doctor-ingest:dev
        imagePullPolicy: IfNotPresent
        observeExisting: true
        ports:
          - name: otlp-grpc
            containerPort: 4317
            servicePort: 4317
          - name: otlp-http
            containerPort: 4318
            servicePort: 4318

    - type: Compute
      name: doctor-query
      properties:
        image: strata/doctor-query:dev
        imagePullPolicy: IfNotPresent
        observeExisting: true
        ports:
          - name: http
            containerPort: 18080
            servicePort: 18080

    - type: Probe
      name: doctor-ingest-health
      dependsOn:
        - doctor-ingest
      properties:
        target: doctor-ingest
        type: tcp
        address: doctor-ingest.strata.svc.cluster.local
        port: 4318
        interval: 30s
        timeout: 3s
        retries: 2

    - type: Probe
      name: doctor-query-health
      dependsOn:
        - doctor-query
      properties:
        target: doctor-query
        type: http
        url: http://doctor-query.strata.svc.cluster.local:18080/healthz
        interval: 30s
        timeout: 3s
        retries: 2
